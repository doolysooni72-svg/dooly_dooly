      - name: Create Capacitor project
        working-directory: app
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json << 'SALINY_CFG_END'
          {
            "appId": "com.saliny.store",
            "appName": "Saliny",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "android": { "allowMixedContent": false }
          }
          SALINY_CFG_END
          npx cap add android
      - name: Customize Android project
        working-directory: app
        run: |
          python3 - << 'SALINY_PY_END'
          import os, re, glob

          base = 'android/app/src/main'

          # 1) location permissions (for the "detect my location" button)
          p = base + '/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          add = ''
          for perm in ['ACCESS_COARSE_LOCATION', 'ACCESS_FINE_LOCATION']:
              if perm not in s:
                  add += '    <uses-permission android:name="android.permission.%s" />\n' % perm
          s = s.replace('</manifest>', add + '</manifest>')
          open(p, 'w', encoding='utf-8').write(s)

          # 2) Arabic app name, written as XML character references (pure ASCII)
          arabic = '\u0645\u0643\u062a\u0628\u0629 \u0627\u0644\u0633\u0644\u064a\u0646\u064a'
          name = ''.join('&#%d;' % ord(c) for c in arabic)
          sp = base + '/res/values/strings.xml'
          t = open(sp, encoding='utf-8').read()
          for key in ['app_name', 'title_activity_main']:
              t = re.sub(r'(<string name="%s">)[^<]*(</string>)' % key,
                         lambda m: m.group(1) + name + m.group(2), t)
          open(sp, 'w', encoding='utf-8').write(t)

          # 3) launcher icon (gold open book on deep green) + matching splash
          res = base + '/res'
          os.makedirs(res + '/drawable', exist_ok=True)
          os.makedirs(res + '/mipmap-anydpi-v26', exist_ok=True)

          bg = """<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#0C2F2E"/>
          </shape>
          """
          fg = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#E3A94D"
                  android:pathData="M52,42 C46,38 38,37 30,38 L30,72 C38,71 46,72 52,76 Z"/>
              <path
                  android:fillColor="#C98A2C"
                  android:pathData="M56,42 C62,38 70,37 78,38 L78,72 C70,71 62,72 56,76 Z"/>
          </vector>
          """
          adaptive = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_saliny_bg"/>
              <foreground android:drawable="@drawable/ic_saliny_fg"/>
          </adaptive-icon>
          """
          splash = """<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#0C2F2E"/>
          </shape>
          """
          def w(path, text):
              open(path, 'w', encoding='utf-8').write(text)

          w(res + '/drawable/ic_saliny_bg.xml', bg)
          w(res + '/drawable/ic_saliny_fg.xml', fg)
          w(res + '/mipmap-anydpi-v26/ic_launcher.xml', adaptive)
          w(res + '/mipmap-anydpi-v26/ic_launcher_round.xml', adaptive)
          for f in glob.glob(res + '/drawable*/splash.png'):
              os.remove(f)
          w(res + '/drawable/splash.xml', splash)
          print('customized OK')

          SALINY_PY_END
          npx cap sync android
      - name: Prepare Android SDK
        run: |
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > app/android/local.properties
      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: saliny-store-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
